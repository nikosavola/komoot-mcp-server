name: CI

on:
  push:
  pull_request:

# Cancel superseded runs on the same ref (e.g. rapid pushes to a PR).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package and dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # The suite is dependency-agnostic by design: tests/conftest.py only
      # installs import stand-ins when kompy/openrouteservice are absent,
      # and tests inject their own fakes. So this run (real deps installed)
      # must produce the same result as a bare environment.
      - name: Run tests
        run: pytest

      # A lint/format gate (ruff) slots in here once the ruff config lands.
